apiVersion: v1
kind: Service
metadata:
  name: jenkins-pod-svc
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
spec:
  type: NodePort
  selector:
    app: jenkins-pod
  ports:
    - name: admin
      port: 8080
      targetPort: 8080
    - name: agent
      port: 50000
      targetPort: 50000
