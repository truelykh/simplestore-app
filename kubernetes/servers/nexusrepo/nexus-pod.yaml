apiVersion: v1
kind: Pod
metadata:
  name: nexus-pod
  namespace: nexus
  labels:
    app: nexus-pod
spec:
  serviceAccountName: nexus-sa
  securityContext:
    fsGroup: 200
    fsGroupChangePolicy: OnRootMismatch
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload
                operator: In
                values:
                  - wnode4
  containers:
    - name: nexus-repo
      image: sonatype/nexus3:3.96.2
      ports:
        - containerPort: 8081
          name: nexus
        - containerPort: 8082
          name: docker
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 750m
          memory: 1.5Gi
      volumeMounts:
        - name: nexus-data
          mountPath: /nexus-data
  volumes:
    - name: nexus-data
      persistentVolumeClaim:
        claimName: nexus-pvc
