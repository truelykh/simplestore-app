apiVersion: v1
kind: Service
metadata:
  name: nexus-svc
  namespace: nexus
  labels:
    app.kubernetes.io/name: nexus
spec:
  type: NodePort
  selector:
    app: nexus-pod
  ports:
    - name: nexus
      port: 8081
      targetPort: 8081
    - name: docker
      port: 8082
      targetPort: 8082
