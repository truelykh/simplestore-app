apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: nginx
  labels:
    app.kubernetes.io/name: nginx
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
        # Use Kubernetes CoreDNS resolver for dynamic runtime resolution
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

        server {
            listen 80;

            # Frontend static UI (Dynamic resolution prevents startup crash if service not ready)
            location / {
                set $frontend_upstream "http://frontend-svc.storeapp.svc.cluster.local:80";
                proxy_pass $frontend_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            # Backend Microservices APIs
            location /api/users {
                set $user_upstream "http://user-svc.storeapp.svc.cluster.local:8080";
                proxy_pass $user_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            location /api/products {
                set $product_upstream "http://product-svc.storeapp.svc.cluster.local:8080";
                proxy_pass $product_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            location /api/orders {
                set $order_upstream "http://order-svc.storeapp.svc.cluster.local:8080";
                proxy_pass $order_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            location /api/payments {
                set $payment_upstream "http://payment-svc.storeapp.svc.cluster.local:8080";
                proxy_pass $payment_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            location /api/notifications {
                set $notif_upstream "http://notification-svc.storeapp.svc.cluster.local:8080";
                proxy_pass $notif_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
        }
    }
